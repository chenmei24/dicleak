name: Publish to PyPI

on:
  push:
    branches: ["master"]
    paths: ["pyproject.toml", "dicleak/__init__.py", ".github/workflows/publish.yml"]
    tags:
      - "v*"

concurrency:
  group: ${{ github.repository }}-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          from dicleak import __version__
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert metadata['project']['version'] == __version__
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__
          PY
      - name: Install development tools
        run: python -m pip install ".[dev]" twine
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', glob.glob('dist/*.whl')[0]])"
      - name: Installed CLI smoke outside checkout
        shell: python
        run: |
          import pathlib, subprocess, tempfile
          source = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as directory:
              subprocess.check_call(['dicleak', '--version'], cwd=directory)
              subprocess.check_call(['dicleak', str(source / 'samples/clean_splits.csv'), '--json', 'audit.json'], cwd=directory)
              result = subprocess.run(['dicleak', str(source / 'samples/flawed_splits.csv')], cwd=directory)
              assert result.returncode == 1, result.returncode
      - name: Check whether version is already published
        id: release-status
        shell: python
        run: |
          import os, urllib.request, urllib.error
          from dicleak import __version__
          try:
              urllib.request.urlopen("https://pypi.org/pypi/dicleak/" + __version__ + "/json", timeout=30).close()
              publish = "false"
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              publish = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("publish=" + publish + "\n")
      - name: Publish to PyPI
        if: steps.release-status.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
