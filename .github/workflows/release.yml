name: GitHub release
on:
  push:
    branches: ["master"]
    paths: ["pyproject.toml", "dicleak/__init__.py", "CHANGELOG.md", ".github/workflows/release.yml"]
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  verify:
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - name: Resolve checked release version
        id: version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          from dicleak import __version__
          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          assert metadata["project"]["version"] == __version__, "Code and package versions differ"
          tag = "v" + __version__
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == tag, "Tag and release version differ"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("tag=" + tag + "\n")
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish checked release and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving it."
          else
            tag_refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
            if [ -n "$tag_refs" ]; then
              git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
              tag_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
              if [ "$tag_commit" != "$GITHUB_SHA" ]; then
                echo "Existing tag refers to a different commit; refusing release."
                exit 1
              fi
            fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
