name: Feature request
description: Suggest a manifest check or workflow improvement
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Workflow and problem
      description: Describe the study design without patient data.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior and synthetic example
      description: Include situations where the check should not flag a problem.
    validations:
      required: true
