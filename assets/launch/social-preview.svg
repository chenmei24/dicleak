<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">dicleak — medical-imaging CSV manifest audit</title>
<desc id="desc">Conceptual synthetic illustration: SYN-001 appears in train and test. dicleak checks a supplied CSV manifest; it does not scan DICOM. Critical overlap fails the audit.</desc>
