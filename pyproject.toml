[project]
name = "dicleak"
version = "0.1.0"
description = "Dataset integrity auditor for medical-imaging AI: catch patient-level data leakage and split flaws before they sink your model or paper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "dicleak contributors" }]
keywords = ["medical-imaging", "dicom", "dataset", "data-leakage", "machine-learning", "validation"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dicleak = "dicleak.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dicleak*"]
